<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Изменение пользователя</title>
</head>
<body>

<form action="/users/update" method="post">
    <input type="hidden" name="id" th:value="${user.id}">

    <table>
        <tr>
            <td><label>Имя:</label></td>
            <td><input type="text" name="name" th:value="${user.name}" required></td>
        </tr>

        <tr>
            <td><label>Фамилия:</label></td>
            <td><input type="text" name="surname" th:value="${user.surname}" required></td>
        </tr>

        <tr>
            <td><label>Возраст:</label></td>
            <td><input type="number" name="age" th:value="${user.age}" required></td>
        </tr>
    </table>

    <button type="submit">Обновить</button>
    <a href="/"><button type="button">Отмена</button></a>
</form>

</body>
</html>
